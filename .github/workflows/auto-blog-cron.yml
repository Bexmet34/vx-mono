name: Auto Blog Content Generator (0 TL Cost)

on:
  schedule:
    # Günde 3 kez çalışır (UTC 06:00, 12:00, 18:00 -> TSİ 09:00, 15:00, 21:00)
    - cron: '0 6,12,18 * * *'
  workflow_dispatch: # Manuel tetikleme imkanı

jobs:
  generate-blog-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.4

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate & Publish Blog Post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/generate-blog.js
