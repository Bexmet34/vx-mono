<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="5">
  <title>Veyronix – System Under Maintenance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inconsolata:wght@500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body,
    html {
      height: 100%;
      width: 100%;
      background: #0B0F19;
      color: #FFFFFF;
      font-family: 'Sora', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Ambient Glowing Background Effect */
    .bg-glow-1 {
      position: absolute;
      top: 20%;
      left: 30%;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(88, 101, 242, 0.2) 0%, rgba(11, 15, 25, 0) 70%);
      filter: blur(60px);
      z-index: 0;
    }

    .bg-glow-2 {
      position: absolute;
      bottom: 20%;
      right: 30%;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, rgba(11, 15, 25, 0) 70%);
      filter: blur(60px);
      z-index: 0;
    }

    .maintenance-container {
      position: relative;
      z-index: 10;
      max-width: 680px;
      width: 90%;
      padding: 3rem 2.5rem;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(88, 101, 242, 0.3);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      text-align: center;
    }

    /* Logo & Brand */
    .brand-title {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: 3px;
      background: linear-gradient(135deg, #5865F2, #38BDF8);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 2rem;
      text-transform: uppercase;
    }

    /* User's Animated 3-Cog Spinner Section */
    .spinny-cogs {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 1.5rem 0 2.5rem 0;
      gap: 0.2rem;
    }

    .fa-spin-one {
      -webkit-animation: fa-spin-one 2.5s infinite linear;
      animation: fa-spin-one 2.5s infinite linear;
    }

    @-webkit-keyframes fa-spin-one {
      0% {
        -webkit-transform: translateY(-1.5rem) rotate(0deg);
        transform: translateY(-1.5rem) rotate(0deg);
      }

      100% {
        -webkit-transform: translateY(-1.5rem) rotate(-359deg);
        transform: translateY(-1.5rem) rotate(-359deg);
      }
    }

    @keyframes fa-spin-one {
      0% {
        -webkit-transform: translateY(-1.5rem) rotate(0deg);
        transform: translateY(-1.5rem) rotate(0deg);
      }

      100% {
        -webkit-transform: translateY(-1.5rem) rotate(-359deg);
        transform: translateY(-1.5rem) rotate(-359deg);
      }
    }

    .fa-spin-two {
      -webkit-animation: fa-spin-two 3.5s infinite linear;
      animation: fa-spin-two 3.5s infinite linear;
    }

    @-webkit-keyframes fa-spin-two {
      0% {
        -webkit-transform: translateY(0.8rem) rotate(0deg);
        transform: translateY(0.8rem) rotate(0deg);
      }

      100% {
        -webkit-transform: translateY(0.8rem) rotate(-359deg);
        transform: translateY(0.8rem) rotate(-359deg);
      }
    }

    @keyframes fa-spin-two {
      0% {
        -webkit-transform: translateY(0.8rem) rotate(0deg);
        transform: translateY(0.8rem) rotate(0deg);
      }

      100% {
        -webkit-transform: translateY(0.8rem) rotate(-359deg);
        transform: translateY(0.8rem) rotate(-359deg);
      }
    }

    .fa-spin-main {
      -webkit-animation: fa-spin-main 4.5s infinite linear;
      animation: fa-spin-main 4.5s infinite linear;
    }

    @keyframes fa-spin-main {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(359deg);
      }
    }

    /* Headings & Text */
    .maintenance-title {
      font-size: 2rem;
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .maintenance-desc {
      color: #94A3B8;
      font-size: 1rem;
      line-height: 1.7;
      margin-bottom: 2rem;
      max-width: 540px;
      margin-left: auto;
      margin-right: auto;
    }

    /* Live Status Badge */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(245, 158, 11, 0.15);
      color: #F59E0B;
      border: 1px solid rgba(245, 158, 11, 0.4);
      padding: 0.5rem 1.2rem;
      border-radius: 50px;
      font-size: 0.88rem;
      font-weight: 700;
      margin-bottom: 2rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #F59E0B;
      border-radius: 50%;
      box-shadow: 0 0 10px #F59E0B;
      animation: pulse-dot 1.5s infinite;
    }

    @keyframes pulse-dot {
      0% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.4;
        transform: scale(1.3);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Discord Support Button */
    .btn-discord {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: #5865F2;
      color: #FFFFFF;
      padding: 0.85rem 1.8rem;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 4px 20px rgba(88, 101, 242, 0.4);
    }

    .btn-discord:hover {
      background: #4752C4;
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(88, 101, 242, 0.6);
    }

    .auto-refresh-notice {
      font-size: 0.8rem;
      color: #64748B;
      margin-top: 1.8rem;
      font-family: 'Inconsolata', monospace;
    }
  </style>
</head>

<body>

  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <div class="maintenance-container">
    <div class="brand-title">VEYRONIX SYSTEM</div>

    <!-- 3 Animated Spinning Cogs -->
    <div class="spinny-cogs">
      <i class="fa-solid fa-gear fa-3x fa-spin-one" style="color: #5865F2;"></i>
      <i class="fa-solid fa-gear fa-5x fa-spin-main" style="color: #38BDF8;"></i>
      <i class="fa-solid fa-gear fa-3x fa-spin-two" style="color: #F59E0B;"></i>
    </div>

    <h1 class="maintenance-title">Under Maintenance</h1>

    <p class="maintenance-desc">
      We are currently performing a quick system update to optimize your experience.
      The page will automatically reconnect once deployment completes.
    </p>

    <div class="status-badge">
      <span class="status-dot"></span>
      Deploying System Update...
    </div>

    <div>
      <a href="https://discord.gg/RqmNxevGvb" target="_blank" rel="noopener noreferrer" class="btn-discord">
        <i class="fa-brands fa-discord"></i> Join Discord Support
      </a>
    </div>

    <div class="auto-refresh-notice">
      ⚡ Auto-checking system status every 5 seconds...
    </div>
  </div>

</body>

</html>
