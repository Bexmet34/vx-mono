<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>VAST Player</title>
    <style>
      body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
      #mainContainer { position: relative; width: 100%; max-width: 640px; height: 100%; max-height: 480px; }
      #contentElement { width: 100%; height: 100%; background: #000; }
      #adContainer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="mainContainer">
      <video id="contentElement" playsinline controls>
        <source src="https://storage.googleapis.com/gvabox/media/samples/stock.mp4" type="video/mp4"></source>
      </video>
      <div id="adContainer"></div>
    </div>
    <script src="//imasdk.googleapis.com/js/sdkloader/ima3.js"></script>
    <script>
      var videoElement = document.getElementById('contentElement');
      var adContainer = document.getElementById('adContainer');
      videoElement.muted = true; // MUST be muted for autoplay
      
      // Visual logger for debugging
      function log(msg) {
        var el = document.createElement('div');
        el.style.color = 'white';
        el.style.fontSize = '12px';
        el.style.position = 'relative';
        el.style.zIndex = '9999';
        el.textContent = msg;
        adContainer.appendChild(el);
      }

      log("Oynatıcı başlatılıyor...");

      var adDisplayContainer = new google.ima.AdDisplayContainer(adContainer, videoElement);
      var adsLoader = new google.ima.AdsLoader(adDisplayContainer);
      var adsManager;

      adsLoader.addEventListener(google.ima.AdsManagerLoadedEvent.Type.ADS_MANAGER_LOADED, onAdsManagerLoaded, false);
      adsLoader.addEventListener(google.ima.AdErrorEvent.Type.AD_ERROR, onAdError, false);

      function onAdError(adErrorEvent) {
        log("Reklam Hatası: " + adErrorEvent.getError().toString());
        videoElement.play();
      }

      function onAdsManagerLoaded(adsManagerLoadedEvent) {
        log("Reklam yüklendi, başlatılıyor...");
        var adsRenderingSettings = new google.ima.AdsRenderingSettings();
        adsRenderingSettings.restoreCustomPlaybackStateOnAdBreakComplete = true;
        adsManager = adsManagerLoadedEvent.getAdsManager(videoElement, adsRenderingSettings);
        
        adsManager.addEventListener(google.ima.AdErrorEvent.Type.AD_ERROR, onAdError);
        adsManager.addEventListener(google.ima.AdEvent.Type.CONTENT_PAUSE_REQUEST, function() { videoElement.pause(); });
        adsManager.addEventListener(google.ima.AdEvent.Type.CONTENT_RESUME_REQUEST, function() { videoElement.play(); });
        adsManager.addEventListener(google.ima.AdEvent.Type.LOADED, function() { adsManager.start(); });
        
        try {
          adsManager.init(640, 480, google.ima.ViewMode.NORMAL);
          adsManager.start();
        } catch (adError) {
          log("Oynatma Hatası: " + adError);
          videoElement.play();
        }
      }

      // Auto-trigger ads request
      setTimeout(function() {
        log("Reklam isteği gönderiliyor...");
        adDisplayContainer.initialize();
        var adsRequest = new google.ima.AdsRequest();
        adsRequest.adTagUrl = 'https://fikirgezgini.rtb.admatic.com.tr/instream?w=640&h=480';
        adsRequest.linearAdSlotWidth = 640;
        adsRequest.linearAdSlotHeight = 480;
        adsRequest.nonLinearAdSlotWidth = 640;
        adsRequest.nonLinearAdSlotHeight = 150;
        adsLoader.requestAds(adsRequest);
      }, 500);

    </script>
  </body>
</html>
